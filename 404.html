<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Página no encontrada | cypentra</title>
  <meta name="description" content="Esta página no existe. Vuelve a cypentra.com para web segura, cloud, equipos dedicados y automatización con IA.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://cypentra.com/">
  <meta name="theme-color" content="#08090b">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #08090b; min-height: 100vh; color: #f5f6f7; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 28px 20px 48px; width: 100%; flex: 1; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand span { font-weight: 700; font-size: 21px; letter-spacing: -0.03em; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 48px 0; }
    .code { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #7ea7d8; margin-bottom: 16px; }
    h1 { font-size: clamp(36px, 8vw, 52px); letter-spacing: -0.03em; line-height: 1.1; font-weight: 700; margin-bottom: 16px; }
    p { font-size: 18px; line-height: 1.6; color: #9ba1a9; max-width: 42ch; margin-bottom: 28px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 14px 22px; border-radius: 10px; font-weight: 700; font-size: 16px; }
    .btn-pri { background: #2e5e9e; color: #fff; }
    .btn-pri:hover { background: #3d6fb0; }
    .btn-ghost { border: 1px solid rgba(255,255,255,.2); color: #dcdee2; }
    .btn-ghost:hover { border-color: rgba(255,255,255,.5); color: #fff; }
    footer { padding-top: 24px; font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 13px; color: #6f757e; }
    footer a { color: #7ea7d8; }
    footer a:hover { color: #f5f6f7; }

    .lang-switch { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2); background: rgba(16,18,24,.55); margin-left: auto; }
    .lang-switch button { appearance: none; border: 0; background: transparent; color: #b6bac1; font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.06em; padding: 6px 9px; border-radius: 999px; cursor: pointer; font-weight: 600; }
    .lang-switch button.is-on { background: #2e5e9e; color: #fff; }
    .wrap > a.brand { display: flex; }
    .top { display: flex; align-items: center; gap: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
    <a class="brand" href="/" aria-label="cypentra inicio">
      <svg viewBox="0 0 48 48" width="34" height="34" aria-hidden="true">
        <g fill="#7ea7d8" transform="translate(24 24) rotate(-34)">
          <rect x="-7.2" y="-13.6" width="26.4" height="9.4" rx="4.7"/>
          <rect x="-19.2" y="4.2" width="26.4" height="9.4" rx="4.7"/>
        </g>
      </svg>
      <span>cypentra</span>
    </a>
    <div class="lang-switch" role="group" aria-label="Idioma">
      <button type="button" data-set-lang="es" class="is-on" aria-pressed="true">ES</button>
      <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
    </div>
    </div>
    <main>
      <div class="code">404</div>
      <h1 data-i18n-en="This page is not here." data-i18n-es="Esta página no está aquí.">Esta página no está aquí.</h1>
      <p data-i18n-en="The link may be old, or the address was typed wrong. The studio is still on the home page." data-i18n-es="El enlace puede estar caducado o la dirección mal escrita. El estudio sigue en la página de inicio.">El enlace puede estar caducado o la dirección mal escrita. El estudio sigue en la página de inicio.</p>
      <div class="actions">
        <a class="btn btn-pri" href="/" data-i18n-en="Back to home" data-i18n-es="Volver al inicio">Volver al inicio</a>
      </div>
    </main>
    <footer>
      <a href="/">cypentra.com</a>
      ·
      <a href="mailto:info@cypentra.com">info@cypentra.com</a>
    </footer>
  </div>
<script>
(function(){
  var KEY='cypentra-lang';
  function getLang(){ try { return localStorage.getItem(KEY)||'es'; } catch(e){ return 'es'; } }
  function apply(lang){
    if(lang!=='en'&&lang!=='es') lang='es';
    document.documentElement.lang=lang;
    document.title = lang==='en' ? 'Page not found | cypentra' : 'Página no encontrada | cypentra';
    document.querySelectorAll('[data-i18n-en][data-i18n-es]').forEach(function(el){
      if(el.children.length) return;
      el.textContent=el.getAttribute(lang==='en'?'data-i18n-en':'data-i18n-es');
    });
    document.querySelectorAll('[data-set-lang]').forEach(function(btn){
      var on=btn.getAttribute('data-set-lang')===lang;
      btn.classList.toggle('is-on', on);
      btn.setAttribute('aria-pressed', on?'true':'false');
    });
    try { localStorage.setItem(KEY, lang); } catch(e){}
  }
  document.addEventListener('click', function(e){
    var btn=e.target.closest && e.target.closest('[data-set-lang]');
    if(!btn) return;
    apply(btn.getAttribute('data-set-lang'));
  });
  apply(getLang());
})();
</script>
</body>
</html>
